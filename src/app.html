<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>nb UI Registry</title>
    <link rel="icon" href="%sveltekit.assets%/favicon.png" sizes="32x32" />
    <link rel="icon" href="%sveltekit.assets%/icon.svg" type="image/svg+xml" />
    <link
      rel="apple-touch-icon"
      href="%sveltekit.assets%/apple-touch-icon.png"
    />
    <link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
    <!-- Deliberately NOT `viewport-fit=cover`. Three CSS rounds -- an opaque
         bar, a colour surface for WebKit's edge sampler, and an opaque status
         bar style -- each fixed a real layer and the strip at the top was still
         soft on the phone. What all three had in common is that the page was
         being asked to occupy the status-bar band at all: with `cover`,
         `env(safe-area-inset-top)` is non-zero because the web view extends
         under the system chrome, and whatever the system draws there (opaque or
         not, glass or not) is drawn over our pixels. Without it the viewport
         starts below the band, the inset is 0, and there are no pixels of ours
         for anything to composite over. The cost is the landscape side insets
         on a notched phone; on a reference page that is a fair trade for a top
         edge that is ours.
         The colour surface in <style> below stays: it costs nothing when the
         inset is zero and it is the right answer for a consumer app that does
         want to draw full-bleed. -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Opaque, not translucent. `black-translucent` is the value that lets the
         page be drawn *under* the status bar, and it is the one place a
         standalone window could still composite something over the top of the
         UI: an opaque bar, then a sampled colour surface, each fixed its own
         layer, and the strip still looked murky on a phone. `black` does not
         ask for a translucent band at all -- iOS paints a solid strip and the
         page starts below it, so the top of the app is our CSS and nothing
         else. The trade is a black strip above a dark navy one; a top nav that
         is crisp on every device is worth more than a seamless seam.
         The colour surface below stays: not every engine reports a zero inset
         in this mode, and it costs nothing when the inset is zero. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="nb UI" />
    <style>
      /* iOS standalone's scroll-edge blur, worked around with a colour surface.
         See README, "The iOS top-edge surface". Inline and before the bundle:
         WebKit samples the top edge on the first frame, and a class added by
         JavaScript is a frame late. */
      .pwa-status-bar-surface {
        display: none;
      }
      @supports (-webkit-touch-callout: none) and (background-clip: text) {
        @media (display-mode: standalone) {
          .pwa-status-bar-surface {
            display: block;
            position: fixed;
            inset: 0 0 auto;
            /* 11px is the threshold (a thinner background is treated as a
               border and skipped by the sampler); the inset is added on top
               because the band WebKit composites over is the safe area, not
               the top 11px of it. Clipped to empty text, so the extra height
               paints nothing. */
            height: calc(11px + env(safe-area-inset-top, 0px));
            z-index: 100;
            pointer-events: none;
            background-color: inherit;
            -webkit-background-clip: text;
            background-clip: text; /* Empty text paints nothing over the controls. */
          }
        }
      }
    </style>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div class="pwa-status-bar-surface" aria-hidden="true"></div>
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
