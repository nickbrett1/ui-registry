<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="nb UI registry">
  <!--
    The house icon: four pieces of a system on the house ground.

    The first mark was the word "nb" in sky on slate - a dark blue tile with one
    warm line under it, which at home-screen size is a dark blue tile. A mark has
    to survive being 60px wide next to thirty other icons, so it is now shape and
    colour rather than type: three solid house accents and one that is only an
    outline, which is the whole idea of a registry - some pieces you use, some you
    have not picked up yet.

    Every colour is a theme token's literal value, because an icon cannot read a
    CSS variable. They are duplicated on purpose and pinned by tests/icon.test.js
    against the published theme, so a palette change fails a test instead of
    leaving the home-screen icon off-brand.
  -->
  <defs>
    <radialGradient id="lamp" cx="0.16" cy="0.06" r="0.95">
      <stop offset="0" stop-color="#7dd3fc" stop-opacity="0.22" />
      <stop offset="0.5" stop-color="#7dd3fc" stop-opacity="0.05" />
      <stop offset="1" stop-color="#7dd3fc" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Full bleed: iOS rounds the corners itself, so any inset or transparency
       shows up as a dark ring or a white one depending on the wallpaper. -->
  <rect width="512" height="512" fill="#0f172a" />
  <rect width="512" height="512" fill="url(#lamp)" />

  <!-- Four pieces, 168px each with a 24px gutter. The composition sits inside
       the maskable safe zone (76px margin = 15%), so a launcher that crops to a
       circle loses none of it. -->
  <rect x="76" y="76" width="168" height="168" rx="44" fill="#7dd3fc" />
  <rect x="268" y="76" width="168" height="168" rx="44" fill="#fce4b8" />
  <rect x="76" y="268" width="168" height="168" rx="44" fill="#6ee7b7" />

  <!-- The piece not yet taken: an outline in the warning accent, fat enough
       (26px) to still read as a ring at 60px rather than a smudge. -->
  <rect x="281" y="281" width="142" height="142" rx="71" fill="none" stroke="#fdba74" stroke-width="26" />
</svg>
